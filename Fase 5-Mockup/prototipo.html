<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rodar — Gestión de alquileres (prototipo)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fa;--sf:#fff;--tx:#14223a;--mu:#64718a;--ln:#e2e7ef;--ac:#185fa5;--ai:#fff;--nv:#143b63;--sel:#e8f1fb;--ok:#1d7a46;--okb:#e3f4ea;--er:#b3261e;--erb:#fdeceb;--wn:#8a5a00;--wnb:#fff3d6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1520;--sf:#161f2d;--tx:#e6ebf2;--mu:#97a4b8;--ln:#27344a;--ac:#5aa2e6;--ai:#0b1420;--nv:#0f2a47;--sel:#1b2c44;--ok:#5fd08b;--okb:#12301f;--er:#ff8a80;--erb:#3a1a18;--wn:#f2c14e;--wnb:#33280d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1520;--sf:#161f2d;--tx:#e6ebf2;--mu:#97a4b8;--ln:#27344a;--ac:#5aa2e6;--ai:#0b1420;--nv:#0f2a47;--sel:#1b2c44;--ok:#5fd08b;--okb:#12301f;--er:#ff8a80;--erb:#3a1a18;--wn:#f2c14e;--wnb:#33280d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:26px;font-weight:500;margin:0 0 4px}h2{font-size:15px;margin:0 0 4px}p{margin:0 0 10px}.mu{color:var(--mu)}.k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);font-weight:600}
.lg{display:grid;grid-template-columns:1fr 1.15fr;min-height:100vh}.lp{background:var(--nv);color:#fff;padding:36px 40px;display:flex;flex-direction:column;gap:18px}.lp h2{font-size:30px;font-weight:600;line-height:1.2;max-width:340px;margin:14px 0 0}.lp p{color:#b9c8dc}
.lp .ft{margin-top:auto;font-size:12px;color:#b9c8dc}.ic{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:18px}
.lf{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--sf)}.lf>div{width:100%;max-width:330px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}.logo i{font-style:normal;width:32px;height:32px;border-radius:8px;background:#fff;color:var(--nv);display:grid;place-items:center}.logo small{display:block;font-size:9px;font-weight:500;letter-spacing:.08em;opacity:.7}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--sf);border-right:1px solid var(--ln);padding:16px 12px;display:flex;flex-direction:column;gap:4px}nav .logo{color:var(--tx);margin:0 6px 18px}nav .logo i{background:var(--ac);color:#fff}
nav .lb{font-size:10px;letter-spacing:.08em;color:var(--mu);margin:0 8px 4px}
nav button{text-align:left;background:none;border:0;color:var(--tx);padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer}nav button.on{background:var(--sel);color:var(--ac);font-weight:600}nav button:hover{background:var(--sel)}
nav .ft{margin-top:auto;border-top:1px solid var(--ln);padding-top:10px;font-size:12px;color:var(--mu)}
.bc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 24px;background:var(--sf);border-bottom:1px solid var(--ln);flex-wrap:wrap}.chip{background:var(--sel);color:var(--ac);border-radius:99px;padding:1px 9px;font-size:11px;margin-left:6px;font-weight:600}
.us{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu)}.av{width:30px;height:30px;border-radius:50%;background:var(--sel);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:11px}.us b{display:block;color:var(--tx);font-size:13px}
main{min-width:0}.pg{padding:22px 24px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}.g4 .card{margin:0}.kpi span{color:var(--mu);font-size:12px}.kpi b{display:block;font-size:28px;font-weight:500;margin:4px 0}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px}tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px 11px;width:100%}input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}input:disabled{background:var(--bg)}
.bar input,.bar select{width:auto;flex:1;min-width:140px}label{display:block;font-size:12px;font-weight:600;margin:0 0 5px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.btn{font:inherit;border:1px solid var(--ac);background:var(--ac);color:var(--ai);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600}.btn.s{background:var(--sf);color:var(--tx);border-color:var(--ln)}.btn.d{background:var(--er);border-color:var(--er);color:#fff}
.badge{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600}.b-ok{background:var(--okb);color:var(--ok)}.b-wn{background:var(--wnb);color:var(--wn)}
.msg{padding:10px 12px;border-radius:8px;margin:12px 0;font-size:13px}.msg.err{background:var(--erb);color:var(--er);border:1px solid var(--er)}.msg.ok{background:var(--okb);color:var(--ok)}
#toast{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:9;max-width:320px}#toast div{margin:0 0 8px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:0}.dl dt{color:var(--mu)}.dl dd{margin:0}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}.mod .card{max-width:380px;margin:0}
.tot td{font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.r{display:flex;justify-content:space-between;padding:6px 0}
@media (max-width:760px){.lg,.app,.g2{grid-template-columns:1fr}.lp{display:none}nav{border-right:0;border-bottom:1px solid var(--ln);flex-direction:row;flex-wrap:wrap}nav .lb,nav .ft{display:none}.dl{grid-template-columns:1fr}.pg{padding:16px}}
</style>
</head>
<body>
<div id="toast"></div><div id="modal"></div><div id="root"></div>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const TODAY='2026-10-24',PEN=50000,SUR=100000;
const USERS={'laura.martinez':['admin123','ADMIN','Laura Martínez'],'daniel.rojas':['emp123','EMPLOYEE','Daniel Rojas'],'maria.torres':['caj123','CASHIER','María Torres']};
const ROLE={ADMIN:'Administrador',EMPLOYEE:'Empleado/Asesor',CASHIER:'Cajero'};
const LBL={dashboard:'Inicio',vehicles:'Vehículos',customers:'Clientes',rentals:'Alquileres',returns:'Devoluciones',invoices:'Facturas'};
const MENU={ADMIN:['dashboard','vehicles','invoices'],EMPLOYEE:['dashboard','vehicles','customers','rentals'],CASHIER:['dashboard','returns','invoices']};
const PARENT={'vehicle-new':'vehicles','vehicle-edit':'vehicles',vehicle:'vehicles','customer-new':'customers',customer:'customers','rental-new':'rentals',rental:'rentals',invoice:'invoices'};
const ACL={'vehicle-new':['ADMIN'],'vehicle-edit':['ADMIN'],'customer-new':['EMPLOYEE'],'rental-new':['EMPLOYEE']};
const S={user:null,view:'dashboard',sel:null,q:'',flt:'',last:null,
vehicles:[['GHI789','BMW','Serie 4','LUXURY',350000,'RENTED'],['DEF456','Renault','Logan','ECONOMY',85000,'RENTED'],['PQR678','Mazda','3','MID_RANGE',150000,'RENTED'],['ABC123','Chevrolet','Spark','ECONOMY',90000,'AVAILABLE'],['STU234','Mazda','CX-30','MID_RANGE',160000,'AVAILABLE'],['VWX567','Toyota','Corolla','MID_RANGE',140000,'AVAILABLE']].map(a=>({plate:a[0],brand:a[1],model:a[2],cat:a[3],rate:a[4],st:a[5]})),
customers:[{doc:'1075634521',name:'Andrés Felipe Cuellar',phone:'3124567890',addr:'Cra 5 # 10-20'},{doc:'1018456789',name:'Camila Rodríguez',phone:'3015550142',addr:'Calle 72 # 9-31'},{doc:'80123456',name:'Juan David Pérez',phone:'3208887766',addr:''},{doc:'52741963',name:'Marcela Rincón',phone:'3009876543',addr:'Calle 8 # 3-14'}],
rentals:[{id:1022,plate:'ABC123',doc:'52741963',start:'2026-10-10',due:'2026-10-13',ret:'2026-10-13',rate:90000},{id:1023,plate:'STU234',doc:'52741963',start:'2026-10-13',due:'2026-10-16',ret:'2026-10-19',rate:160000},{id:1024,plate:'GHI789',doc:'1075634521',start:'2026-10-22',due:'2026-10-25',ret:null,rate:350000},{id:1025,plate:'DEF456',doc:'1018456789',start:'2026-10-23',due:'2026-10-26',ret:null,rate:85000},{id:1026,plate:'PQR678',doc:'80123456',start:'2026-10-24',due:'2026-10-27',ret:null,rate:150000}],
invoices:[{id:1,rid:1022,date:'2026-10-13'},{id:2,rid:1023,date:'2026-10-19'}]};
const veh=p=>S.vehicles.find(v=>v.plate===p),cus=d=>S.customers.find(c=>c.doc===d),ren=i=>S.rentals.find(r=>r.id==i);
const bill=r=>{const d=days(r.start,r.due),late=r.ret?Math.max(days(r.due,r.ret),0):0,sur=veh(r.plate).cat==='LUXURY'?SUR:0,pen=late*PEN,sub=d*r.rate;return{d,late,sub,sur,pen,total:sub+sur+pen}};
const badge=s=>s==='AVAILABLE'?'<span class="badge b-ok">Disponible</span>':'<span class="badge b-wn">Alquilado</span>';
const CAT={ECONOMY:'Económico',MID_RANGE:'Intermedio',LUXURY:'Lujo'};
const role=()=>S.user.role,code=r=>'ALQ-'+r.id,fac=i=>'FAC-'+String(i.id).padStart(4,'0'),vl=p=>p+' · '+veh(p).brand+' '+veh(p).model;
const TB=(h,r,e)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r||`<tr><td colspan="${h.length}" class="mu">${e}</td></tr>`}</table></div>`;
const FD=(l,id,v,x)=>`<div><label>${l}</label><input id="${id}" value="${v||''}" ${x||''}></div>`;
const HD=(t,s,b)=>`<div class="top"><div><h1>${t}</h1><p class="mu">${s}</p></div>${b||''}</div>`;
const BK=(v,l)=>`<button class="btn s" onclick="go('${v}')">← ${l||'Volver'}</button>`;

function toast(m,t){const e=document.createElement('div');e.className='msg '+(t||'ok');e.textContent=m;$('toast').appendChild(e);setTimeout(()=>e.remove&&e.remove(),3600)}
function err(m){$('err').innerHTML=m?'<div class="msg err">'+m+'</div>':''}
function confirmBox(txt,fn){$('modal').innerHTML='<div class="mod"><div class="card"><h2>Confirmar acción</h2><p>'+txt+'</p><div class="row"><button class="btn d" id="cy">Confirmar</button><button class="btn s" id="cn">Cancelar</button></div></div></div>';
$('cy').onclick=()=>{$('modal').innerHTML='';fn()};$('cn').onclick=()=>{$('modal').innerHTML=''}}
function allowed(v){const m=PARENT[v]||v;return(!ACL[v]||ACL[v].includes(role()))&&MENU[role()].includes(m)}
function go(v,sel){if(!allowed(v)){toast('Acceso denegado: tu rol no permite esta función.','err');return}S.view=v;S.sel=sel===undefined?null:sel;S.q='';S.flt='';draw()}
function login(e){e.preventDefault();const u=$('u').value.trim().toLowerCase(),p=$('p').value;
if(!u||!p){err('Ingresa usuario y contraseña.');return}
const x=USERS[u];if(!x||x[0]!==p){err('Usuario o contraseña incorrectos.');return}
S.user={name:x[2],role:x[1]};S.view='dashboard';draw();toast('Bienvenido, '+x[2].split(' ')[0]+'.')}
function quick(u){$('u').value=u;$('p').value=USERS[u][0]}
function logout(){S.user=null;draw()}

const V={
dashboard(){const av=S.vehicles.filter(v=>v.st==='AVAILABLE').length,ac=S.rentals.filter(r=>!r.ret),inc=S.invoices.reduce((s,i)=>s+bill(ren(i.rid)).total,0),nx=ac.map(r=>r.due).sort()[0];
const A={ADMIN:[['vehicle-new','Registrar vehículo'],['invoices','Consultar facturas']],EMPLOYEE:[['rental-new','Nuevo alquiler'],['customer-new','Registrar cliente'],['vehicles','Ver disponibilidad']],CASHIER:[['returns','Registrar devolución'],['invoices','Consultar facturas']]}[role()];
return`${HD('Hola, '+S.user.name.split(' ')[0],'Este es el resumen de la operación de hoy, sábado 24 de octubre.')}<p class="k">Recorrido ${ROLE[role()].toLowerCase()} · inicio</p>
<div class="g4"><div class="card kpi"><span>Vehículos disponibles</span><b>${av}</b><span>Listos para alquilar</span></div><div class="card kpi"><span>Vehículos alquilados</span><b>${S.vehicles.length-av}</b><span>De ${S.vehicles.length} vehículos en flota</span></div><div class="card kpi"><span>Alquileres activos</span><b>${ac.length}</b><span>Próximo vencimiento: ${nx.slice(8)} oct</span></div><div class="card kpi"><span>Total facturado</span><b>${fmt(inc)}</b><span>Acumulado · octubre 2026</span></div></div>
<div class="card"><h2>Alquileres activos</h2>${TB(['Contrato','Cliente','Vehículo','Fecha límite','Estado'],ac.map(r=>`<tr class="cl" onclick="go('${role()==='EMPLOYEE'?'rental':'dashboard'}',${r.id})"><td>${code(r)}</td><td>${cus(r.doc).name}</td><td>${vl(r.plate)}</td><td>${r.due}</td><td><span class="badge b-ok">Activo</span></td></tr>`).join(''),'No hay alquileres activos.')}</div>
<div class="g2"><div class="card"><h2>Acciones rápidas</h2><p class="mu">Accesos de tu espacio de trabajo</p><div class="row">${A.map((a,i)=>`<button class="btn ${i?'s':''}" onclick="go('${a[0]}')">${a[1]}</button>`).join('')}</div></div>
<div class="card"><h2>Cierre del día</h2><div class="r"><span class="mu">Devoluciones hoy</span><b>${S.rentals.filter(r=>r.ret===TODAY).length}</b></div><div class="r"><span class="mu">Facturas emitidas</span><b>${S.invoices.length}</b></div></div></div>`},

vehicles(){const q=S.q.toLowerCase(),f=S.flt,ad=role()==='ADMIN';const L=S.vehicles.filter(v=>(f?v.st===f:(ad||v.st==='AVAILABLE'))&&(v.plate+v.brand+v.model).toLowerCase().includes(q));
return`${HD(ad?'Vehículos':'Disponibilidad',ad?'Gestión de la flota.':'Vehículos listos para alquilar.',ad?'<button class="btn" onclick="go(\'vehicle-new\')">+ Registrar vehículo</button>':'')}
<div class="card"><div class="bar"><input placeholder="Buscar por placa, marca o modelo" value="${S.q}" oninput="S.q=this.value;list()"><select onchange="S.flt=this.value;list()"><option value="">${ad?'Todos los estados':'Solo disponibles'}</option><option value="AVAILABLE" ${f==='AVAILABLE'?'selected':''}>Disponibles</option><option value="RENTED" ${f==='RENTED'?'selected':''}>Alquilados</option></select></div>
${TB(['Placa','Vehículo','Categoría','Tarifa/día','Estado'],L.map(v=>`<tr class="cl" onclick="go('vehicle','${v.plate}')"><td>${v.plate}</td><td>${v.brand} ${v.model}</td><td>${CAT[v.cat]}</td><td>${fmt(v.rate)}</td><td>${badge(v.st)}</td></tr>`).join(''),'No hay vehículos disponibles en este momento.')}</div>`},

'vehicle-new'(){return VF(null)},
'vehicle-edit'(){return VF(veh(S.sel))},
vehicle(){const v=veh(S.sel);return`${HD(v.brand+' '+v.model,'Detalle del vehículo',BK('vehicles'))}
<div class="card"><dl class="dl"><dt>Placa</dt><dd>${v.plate}</dd><dt>Categoría</dt><dd>${CAT[v.cat]}</dd><dt>Tarifa diaria</dt><dd>${fmt(v.rate)}</dd><dt>Estado</dt><dd>${badge(v.st)}</dd></dl>
${role()==='ADMIN'?`<div class="row"><button class="btn" onclick="go('vehicle-edit','${v.plate}')">Editar</button><button class="btn d" onclick="delVeh('${v.plate}')">Eliminar vehículo</button></div>`:''}</div>`},

customers(){const q=S.q.toLowerCase();const L=S.customers.filter(c=>(c.doc+c.name).toLowerCase().includes(q));
return`${HD('Clientes','Consulta y registro de clientes.','<button class="btn" onclick="go(\'customer-new\')">+ Registrar cliente</button>')}
<div class="card"><div class="bar"><input placeholder="Buscar por documento o nombre" value="${S.q}" oninput="S.q=this.value;list()"></div>${TB(['Documento','Nombre','Teléfono'],L.map(c=>`<tr class="cl" onclick="go('customer','${c.doc}')"><td>${c.doc}</td><td>${c.name}</td><td>${c.phone}</td></tr>`).join(''),'Sin resultados.')}</div>`},

'customer-new'(){return`${HD('Registrar cliente','Todos los datos son obligatorios, salvo la dirección.')}<div class="card"><form onsubmit="saveCus(event)"><div class="f">
${FD('Documento (solo números)','dc','','inputmode="numeric"')}${FD('Nombre completo','nm')}${FD('Teléfono (mín. 7 dígitos)','ph')}${FD('Dirección (opcional)','ad')}</div><div id="err"></div>
<div class="row"><button class="btn">Guardar cliente</button><button type="button" class="btn s" onclick="go('customers')">Cancelar</button></div></form></div>`},

customer(){const c=cus(S.sel);return`${HD(c.name,'Datos de contacto',BK('customers'))}
<div class="card"><form onsubmit="updCus(event)"><div class="f">${FD('Documento','dc',c.doc,'disabled')}${FD('Teléfono','ph',c.phone)}${FD('Dirección','ad',c.addr)}</div><div id="err"></div><div class="row"><button class="btn">Actualizar datos</button></div></form></div>`},

rentals(){return`${HD('Alquileres','Contratos activos y cerrados.','<button class="btn" onclick="go(\'rental-new\')">+ Nuevo alquiler</button>')}
<div class="card">${TB(['Contrato','Cliente','Vehículo','Inicio','Fecha límite','Estado'],S.rentals.slice().reverse().map(r=>`<tr class="cl" onclick="go('rental',${r.id})"><td>${code(r)}</td><td>${cus(r.doc).name}</td><td>${vl(r.plate)}</td><td>${r.start}</td><td>${r.due}</td><td>${r.ret?'<span class="badge b-ok">Cerrado</span>':'<span class="badge b-wn">Activo</span>'}</td></tr>`).join(''))}</div>`},

'rental-new'(){const av=S.vehicles.filter(v=>v.st==='AVAILABLE');
return`${HD('Nuevo alquiler','El cliente debe estar registrado.')}<div class="card"><form onsubmit="saveRen(event)"><div class="f">${FD('Documento del cliente','dc','','inputmode="numeric" placeholder="1075634521"')}
<div><label>Vehículo disponible</label><select id="pl" onchange="est()">${av.map(v=>`<option value="${v.plate}">${vl(v.plate)} · ${fmt(v.rate)}/día</option>`).join('')||'<option value="">No hay vehículos disponibles</option>'}</select></div>
<div><label>Cantidad de días (mín. 1)</label><input id="dy" type="number" value="1" oninput="est()"></div></div><div class="msg ok" id="es"></div><div id="err"></div>
<div class="row"><button class="btn">Confirmar alquiler</button><button type="button" class="btn s" onclick="go('rentals')">Cancelar</button></div></form></div>`},

rental(){const r=ren(S.sel),c=cus(r.doc),b=bill(r);
return`${HD('Alquiler '+code(r),'Detalle del contrato',BK('rentals'))}<div class="card"><dl class="dl"><dt>Cliente</dt><dd>${c.name} (${c.doc})</dd><dt>Vehículo</dt><dd>${vl(r.plate)}</dd><dt>Inicio</dt><dd>${r.start}</dd><dt>Fecha límite</dt><dd>${r.due}</dd><dt>Días</dt><dd>${b.d}</dd><dt>Tarifa pactada</dt><dd>${fmt(r.rate)}/día</dd><dt>Estado</dt><dd>${r.ret?'Cerrado — devuelto el '+r.ret:'<span class="badge b-wn">Activo</span>'}</dd></dl></div>
<div class="card"><h2>Extender alquiler</h2><form onsubmit="extend(event)"><div class="f">${FD('Días adicionales','ex','1','type="number"')}</div><div id="err"></div><div class="row"><button class="btn">Extender</button></div></form></div>`},

returns(){const pend=S.rentals.filter(r=>r.ret&&!S.invoices.some(i=>i.rid===r.id)),L=S.last;
return`${HD('Devoluciones','Registra la entrega física del vehículo y genera la factura.')}
<div class="card"><form onsubmit="doRet(event)"><div class="f">${FD('Placa del vehículo','pl','','placeholder="GHI789"')}${FD('Fecha de devolución','rd',TODAY,'type="date"')}</div><div id="err"></div><div class="row"><button class="btn">Registrar devolución</button></div></form></div>
${L?`<div class="card"><h2>Devolución registrada — ${code(L)}</h2><p>Días de mora: <b>${bill(L).late}</b> · Multa: <b>${fmt(bill(L).pen)}</b></p><button class="btn" onclick="mkInv(${L.id})">Generar factura</button></div>`:''}
${pend.length?`<div class="card"><h2>Pendientes de facturar</h2>${pend.map(r=>`<p>${code(r)} · ${r.plate} <button class="btn s" onclick="mkInv(${r.id})">Generar factura</button></p>`).join('')}</div>`:''}`},

invoices(){return`${HD('Facturas','Facturas emitidas.')}<div class="card">${TB(['Factura','Fecha','Cliente','Placa','Total'],S.invoices.slice().reverse().map(i=>{const r=ren(i.rid);return`<tr class="cl" onclick="go('invoice',${i.id})"><td>${fac(i)}</td><td>${i.date}</td><td>${cus(r.doc).name}</td><td>${r.plate}</td><td>${fmt(bill(r).total)}</td></tr>`}).join(''))}</div>`},

invoice(){const i=S.invoices.find(x=>x.id==S.sel),r=ren(i.rid),c=cus(r.doc),b=bill(r);
return`${HD('Factura '+fac(i),'Desglose del cobro',BK('invoices'))}<div class="card"><dl class="dl"><dt>Cliente</dt><dd>${c.name} (${c.doc})</dd><dt>Vehículo</dt><dd>${vl(r.plate)}</dd><dt>Fecha</dt><dd>${i.date}</dd></dl></div>
<div class="card">${TB(['Concepto','Valor'],`<tr><td>Subtotal (${b.d} días × ${fmt(r.rate)})</td><td>${fmt(b.sub)}</td></tr><tr><td>Recargo vehículo de lujo</td><td>${fmt(b.sur)}</td></tr><tr><td>Multa por mora (${b.late} días × ${fmt(PEN)})</td><td>${fmt(b.pen)}</td></tr><tr class="tot"><td>Gran total</td><td>${fmt(b.total)}</td></tr>`)}</div>`}
};
function VF(v){const e=!!v;return`${HD(e?'Editar vehículo':'Registrar vehículo',e?'Actualiza los datos del vehículo.':'Se registrará como Disponible.')}<div class="card"><form onsubmit="saveVeh(event)"><div class="f">
${FD('Placa','pl',e?v.plate:'',e?'disabled':'maxlength="8" placeholder="ABC123"')}${FD('Marca','br',e?v.brand:'')}${FD('Modelo','mo',e?v.model:'')}
<div><label>Categoría</label><select id="ca">${Object.keys(CAT).map(k=>`<option value="${k}" ${e&&v.cat===k?'selected':''}>${CAT[k]}</option>`).join('')}</select></div>${FD('Tarifa diaria (COP)','ra',e?v.rate:'','type="number"')}</div><div id="err"></div>
<div class="row"><button class="btn">${e?'Guardar cambios':'Guardar vehículo'}</button><button type="button" class="btn s" onclick="go('vehicles')">Cancelar</button></div></form></div>`}

function saveVeh(e){e.preventDefault();const ed=S.view==='vehicle-edit',p=ed?S.sel:$('pl').value.trim().toUpperCase(),b=$('br').value.trim(),m=$('mo').value.trim(),t=Number($('ra').value);
if(!p||!b||!m||!$('ra').value){err('Completa todos los campos.');return}
if(!/^[A-Z0-9]{5,8}$/.test(p)){err('La placa debe ser alfanumérica (5 a 8 caracteres).');return}
if(!ed&&veh(p)){err('Ya existe un vehículo con esa placa.');return}
if(!(t>0)){err('La tarifa diaria debe ser mayor a cero.');return}
if(ed){const v=veh(p);Object.assign(v,{brand:b,model:m,cat:$('ca').value,rate:t});toast('Vehículo actualizado correctamente.');go('vehicle',p);return}
S.vehicles.push({plate:p,brand:b,model:m,cat:$('ca').value,rate:t,st:'AVAILABLE'});toast('Vehículo '+p+' registrado y marcado como Disponible.');go('vehicles')}
function delVeh(p){if(veh(p).st==='RENTED'){toast('No se puede eliminar: el vehículo tiene un contrato activo.','err');return}
confirmBox('¿Eliminar el vehículo '+p+' del inventario? Esta acción no se puede deshacer.',()=>{S.vehicles=S.vehicles.filter(x=>x.plate!==p);toast('Vehículo eliminado del inventario.');go('vehicles')})}
function saveCus(e){e.preventDefault();const d=$('dc').value.trim(),n=$('nm').value.trim(),p=$('ph').value.trim();
if(!d||!n||!p){err('Documento, nombre y teléfono son obligatorios.');return}
if(!/^[0-9]+$/.test(d)){err('El documento debe contener únicamente caracteres numéricos.');return}
if(cus(d)){err('El cliente ya existe en la base de datos.');return}
if(p.length<7){err('El teléfono debe tener al menos 7 dígitos.');return}
S.customers.push({doc:d,name:n,phone:p,addr:$('ad').value.trim()});toast('Cliente registrado correctamente.');go('customers')}
function updCus(e){e.preventDefault();const p=$('ph').value.trim();
if(!/^[0-9]{7,}$/.test(p)){err('El teléfono debe tener solo números y al menos 7 dígitos.');return}
const c=cus(S.sel);c.phone=p;c.addr=$('ad').value.trim();toast('Información actualizada correctamente.')}
function est(){const v=veh($('pl').value),d=Number($('dy').value);$('es').textContent=v&&d>=1?'Total estimado: '+fmt(v.rate*d)+' · Fecha límite: '+addD(TODAY,d):'Ingresa los datos para ver el estimado.'}
function saveRen(e){e.preventDefault();const d=$('dc').value.trim(),p=$('pl').value,n=Number($('dy').value);
if(!cus(d)){err('El cliente debe estar registrado antes de alquilar.');return}
if(!p||veh(p).st!=='AVAILABLE'){err('El vehículo no está disponible para alquiler.');return}
if(!(n>=1)||!Number.isInteger(n)){err('El alquiler mínimo es de 1 día.');return}
const v=veh(p);v.st='RENTED';const id=Math.max(...S.rentals.map(r=>r.id))+1;S.rentals.push({id,plate:p,doc:d,start:TODAY,due:addD(TODAY,n),ret:null,rate:v.rate});toast('Alquiler ALQ-'+id+' registrado. Fecha límite: '+addD(TODAY,n)+'.');go('rentals')}
function extend(e){e.preventDefault();const r=ren(S.sel),n=Number($('ex').value);
if(r.ret){err('No hay un alquiler activo para este contrato.');return}
if(!(n>0)||!Number.isInteger(n)){err('Los días adicionales deben ser mayores a cero.');return}
r.due=addD(r.due,n);toast('Alquiler extendido. Nueva fecha límite: '+r.due+'.');draw()}
function doRet(e){e.preventDefault();const p=$('pl').value.trim().toUpperCase(),d=$('rd').value;
if(!p){err('Ingresa una placa válida.');return}
const r=S.rentals.find(x=>x.plate===p&&!x.ret);
if(!r){err('No se encontró un alquiler activo para esta placa.');return}
if(!d||d<r.start){err('La fecha de devolución es inconsistente: es anterior al inicio del contrato.');return}
r.ret=d;veh(p).st='AVAILABLE';S.last=r;toast('Devolución registrada. Vehículo disponible nuevamente.');draw()}
function mkInv(id){if(S.invoices.some(i=>i.rid===id)){toast('Este alquiler ya tiene factura.','err');return}
const r=ren(id);if(!r.ret){toast('El vehículo aún no ha sido devuelto.','err');return}
const n=S.invoices.length+1;S.invoices.push({id:n,rid:id,date:r.ret});S.last=null;toast('Factura generada.');go('invoice',n)}

function list(){const was=document.activeElement&&document.activeElement.tagName==='INPUT';draw();if(was){const i=document.querySelector('main .bar input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
function draw(){const R=$('root');
if(!S.user){R.innerHTML=`<div class="lg"><div class="lp"><div class="logo"><i>R</i><div>Rodar<small>GESTIÓN DE ALQUILERES</small></div></div><div class="ic">🛡</div><h2>Todo listo para una nueva jornada.</h2><p>Gestión interna de vehículos, clientes, alquileres y facturación.</p><div><p class="k" style="color:#b9c8dc;margin:0">Sede Bogotá</p>Operación principal · Colombia</div><div class="ft">Solo personal autorizado<br>Tus módulos se habilitan según el rol asignado.</div></div>
<div class="lf"><div><p class="k">Acceso interno</p><h1>Iniciar sesión</h1><p class="mu">Ingresa tus credenciales para continuar.</p><form onsubmit="login(event)">${FD('Usuario','u','','autocomplete="username" placeholder="Ingresa tu usuario"')}<div style="height:12px"></div><div><label>Contraseña</label><input id="p" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña"></div><div id="err"></div><div class="row"><button class="btn" style="width:100%">Iniciar sesión</button></div></form>
<p class="mu" style="margin-top:16px;font-size:12px">¿Necesitas acceso? Comunícate con el administrador de tu sede.</p><p class="k" style="margin:22px 0 6px">Acceso rápido (demo)</p><div class="row" style="margin:0"><button class="btn s" onclick="quick('laura.martinez')">Administrador</button><button class="btn s" onclick="quick('daniel.rojas')">Empleado</button><button class="btn s" onclick="quick('maria.torres')">Cajero</button></div></div></div></div>`;return}
const cur=PARENT[S.view]||S.view,n=S.user.name;
R.innerHTML=`<div class="app"><nav><div class="logo"><i>R</i><div>Rodar<small>GESTIÓN DE ALQUILERES</small></div></div><div class="lb">ESPACIO DE TRABAJO</div>${MENU[role()].map(m=>`<button class="${m===cur?'on':''}" onclick="go('${m}')">${LBL[m]}</button>`).join('')}<div class="ft">Sede Bogotá · Principal<br><button onclick="logout()" style="padding:6px 0">Cerrar sesión</button></div></nav>
<main><div class="bc"><div>Operación / <b>${LBL[cur]}</b><span class="chip">${ROLE[role()]}</span></div><div class="us"><span>24 oct 2026</span><div class="av">${n.split(' ').map(w=>w[0]).join('').slice(0,2)}</div><div><b>${n}</b>${ROLE[role()]}</div></div></div><div class="pg">${V[S.view]()}</div></main></div>`;
if(S.view==='rental-new')est()}
draw();
</script>
</body>
</html>
